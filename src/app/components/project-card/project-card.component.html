<article class="tactical-panel p-4 h-100 d-flex flex-column justify-content-between project-card">
  <div>
    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
      <span class="mono-label">[ {{ project.code }} // {{ project.category }} ]</span>
      <span class="mono-label text-tactical-muted">PRODUCTION</span>
    </div>

    <h3 class="h5 fw-bold text-tactical-title mb-2">
      {{ project.name }}
    </h3>

    <p class="small mb-4 card-description text-tactical-body">
      {{ project.description }}
    </p>

    <div class="mb-4">
      <div class="mono-label mb-2">TECNOLOGÍAS</div>
      <div class="d-flex flex-wrap gap-2">
        @for (tech of project.technologies; track tech) {
          <span class="tactical-chip">{{ tech }}</span>
        }
      </div>
    </div>
  </div>

  <div class="pt-3 border-top d-flex flex-wrap gap-2">
    <a
      [href]="project.repoUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="btn btn-tactical-outline flex-grow-1 py-2 px-3 d-inline-flex align-items-center justify-content-center gap-2"
    >
      <i class="bi bi-github"></i>
      <span>Ver Repositorio</span>
    </a>
    <a
      [href]="project.liveUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="btn btn-tactical-primary flex-grow-1 py-2 px-3 d-inline-flex align-items-center justify-content-center gap-2"
    >
      <i class="bi bi-box-arrow-up-right"></i>
      <span>Ver Aplicación</span>
    </a>
  </div>
</article>
